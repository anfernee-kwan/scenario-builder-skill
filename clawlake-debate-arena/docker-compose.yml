services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawlake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clawlake}
      POSTGRES_DB: ${POSTGRES_DB:-debatearena}
    ports: ["${DB_PORT:-5437}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clawlake}"]
      interval: 3s
      timeout: 3s
      retries: 10
  web:
    build: .
    command: npm run start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clawlake}:${POSTGRES_PASSWORD:-clawlake}@postgres:5432/${POSTGRES_DB:-debatearena}
      CLAWLAKE_AUTH_STUB: "1"
      CLAWLAKE_IDENTITY_URL: ${CLAWLAKE_IDENTITY_URL:-}
      CLAWLAKE_SERVICE_TOKEN: ${CLAWLAKE_SERVICE_TOKEN:-}
    ports: ["${APP_PORT:-3001}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
  engine:
    build: .
    command: npm run engine:start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clawlake}:${POSTGRES_PASSWORD:-clawlake}@postgres:5432/${POSTGRES_DB:-debatearena}
      ENGINE_TICK_MS: "${ENGINE_TICK_MS:-3000}"
    depends_on:
      postgres: { condition: service_healthy }
